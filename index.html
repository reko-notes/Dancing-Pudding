<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e}
canvas{display:block}
#guiToggle{position:fixed;top:16px;right:16px;z-index:20;background:rgba(15,15,30,0.85);
  color:#eee;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 12px;
  cursor:pointer;font-size:18px;backdrop-filter:blur(8px);line-height:1}
#guiToggle:hover{background:rgba(40,40,60,0.9)}
#gui{position:fixed;top:52px;right:16px;width:260px;background:rgba(15,15,30,0.92);
  padding:14px 18px;border-radius:10px;color:#eee;font-size:13px;
  font-family:system-ui,sans-serif;z-index:10;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.06);
  max-height:calc(100vh - 70px);overflow-y:auto;transition:opacity 0.3s,transform 0.3s}
#gui.hidden{opacity:0;pointer-events:none;transform:translateX(20px)}
#gui h3{text-align:center;margin-bottom:10px;letter-spacing:1px}
.ctrl{margin-bottom:4px;padding:8px 0;cursor:default}
.ctrl.hidden{display:none}
.ctrl label{display:block;margin-bottom:2px;font-size:11px;opacity:0.7}
.ctrl .v{float:right;font-family:monospace;font-size:11px;opacity:0.5}
input[type=range]{width:100%;height:20px;cursor:pointer}
select{width:100%;padding:4px;background:#111;color:#eee;border:1px solid #333;border-radius:5px}
input[type=color]{width:100%;height:28px;border:1px solid #333;border-radius:5px;background:#111;padding:1px;cursor:pointer}
button{width:100%;padding:6px;background:#333;color:#eee;border:1px solid #444;border-radius:5px;cursor:pointer;font-size:12px;margin-top:3px}
button:hover{background:#444}
button.on{background:#664488;border-color:#886aaa}
.sep{font-size:9px;opacity:0.35;letter-spacing:2px;margin:12px 0 6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.06)}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;cursor:pointer}
.chk label{font-size:12px;opacity:0.85;cursor:pointer}
</style>
</head>
<body>
<div id="guiToggle">🍮</div>
<div id="gui">
  <h3>🍮 PUDDING</h3>

  <div class="sep">BASIC</div>

  <div class="ctrl">
    <label>Dance <span class="v" id="danceVal">Bounce</span></label>
    <select id="dance">
      <option value="bounce">Bounce</option>
      <option value="twist">Twist</option>
      <option value="sway">Sway</option>
      <option value="hop">Hop</option>
    </select>
  </div>

  <div class="ctrl">
    <label>BPM <span class="v" id="bpmVal">120</span></label>
    <input type="range" id="bpm" min="60" max="150" value="120">
  </div>

  <div class="ctrl">
    <label>Jiggle <span class="v" id="jigVal">0.60</span></label>
    <input type="range" id="jig" min="0" max="100" value="60">
  </div>

  <div class="ctrl">
    <label>Sync <span class="v" id="syncVal">1.00</span></label>
    <input type="range" id="sync" min="0" max="100" value="100">
  </div>

  <div class="ctrl">
    <label>Puddings <span class="v" id="cntVal">1</span></label>
    <input type="range" id="cnt" min="1" max="7" step="2" value="1">
  </div>

  <div class="sep">FORMATION</div>

  <div class="ctrl">
    <label>Formation <span class="v" id="formationVal">Line</span></label>
    <select id="formation">
      <option value="line">Line</option>
      <option value="circle">Circle</option>
    </select>
  </div>

  <div class="ctrl">
    <label>Motion <span class="v" id="formationMotionVal">None</span></label>
    <select id="formationMotion"></select>
  </div>

  <div class="ctrl" id="spacingCtrl">
    <label>Spacing <span class="v" id="spcVal">1.6</span></label>
    <input type="range" id="spc" min="10" max="30" value="16">
  </div>

  <div class="ctrl" id="radiusCtrl">
    <label>Circle Radius <span class="v" id="radVal">200</span></label>
    <input type="range" id="radius" min="80" max="500" step="10" value="200">
  </div>

  <button id="btnReset">Reset Positions</button>

  <div class="sep">APPEARANCE</div>

  <div class="ctrl">
    <label>Pudding</label>
    <input type="color" id="colBody" value="#f4b860">
  </div>
  <div class="ctrl">
    <label>Caramel</label>
    <input type="color" id="colCara" value="#8b4513">
  </div>
  <div class="ctrl">
    <label>Background</label>
    <input type="color" id="colBg" value="#1a1a2e">
  </div>
  <div class="ctrl">
    <label>Cheek</label>
    <input type="color" id="colCheek" value="#ff6464">
  </div>
  <div class="ctrl">
    <label>Cheek Alpha <span class="v" id="chkAVal">0.31</span></label>
    <input type="range" id="chkA" min="0" max="100" value="31">
  </div>

  <div class="sep">AUTOMATION</div>

  <button id="btnManual" class="on">Manual</button>
  <button id="btnAuto">Auto</button>

  <div class="chk">
    <input type="checkbox" id="lockBpm">
    <label for="lockBpm">Lock BPM</label>
  </div>

  <div class="ctrl" style="margin-top:8px">
    <label>Auto Interval <span class="v" id="intVal">6</span>s</label>
    <input type="range" id="autoInt" min="3" max="20" value="6">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
// ── GUI toggle ──
const guiEl = document.getElementById('gui');
const toggleEl = document.getElementById('guiToggle');
let guiVisible = true;
toggleEl.onclick = () => {
  guiVisible = !guiVisible;
  guiEl.classList.toggle('hidden', !guiVisible);
};

document.querySelectorAll('#gui .ctrl').forEach(ctrl => {
  const slider = ctrl.querySelector('input[type=range]');
  if (!slider) return;
  ctrl.addEventListener('wheel', e => {
    e.preventDefault();
    e.stopPropagation();
    const step = parseFloat(slider.step) || 1;
    const delta = e.deltaY < 0 ? step : -step;
    slider.value = Math.min(+slider.max, Math.max(+slider.min, +slider.value + delta));
    slider.dispatchEvent(new Event('input'));
  }, {passive: false});
});

// ── Formation Motion definitions ──
const FORMATION_MOTIONS = {
  line: [
    { value:'none', label:'None' },
    { value:'wave', label:'Wave' },
    { value:'accordion', label:'Accordion' },
    { value:'seesaw', label:'Seesaw' }
  ],
  circle: [
    { value:'none', label:'None' },
    { value:'breathe', label:'Breathe' },
    { value:'petal', label:'Petal' },
    { value:'wave', label:'Wave' },
    { value:'star', label:'Star' },
    { value:'jitter', label:'Jitter' }
  ]
};

// ── State ──
const S = {
  dance:'bounce', bpm:120, jiggle:0.6,
  sync:1.0,
  colBody:'#f4b860', colCara:'#8b4513', colBg:'#1a1a2e',
  colCheek:'#ff6464', cheekAlpha:0.31,
  count:1,
  spacing:1.6,
  formation:'line',
  formationMotion:'none',
  circleRadius:200,
  auto:false, autoTimer:0, autoInterval:6,
  lockBpm:false,
  zoom:1.0
};
const danceList = ['bounce','twist','sway','hop'];

const facePool = [
  {eyeScale:1.0,  mouthType:'smile',  blinkRate:0.03},
  {eyeScale:1.2,  mouthType:'grin',   blinkRate:0.025},
  {eyeScale:0.85, mouthType:'oh',     blinkRate:0.02},
  {eyeScale:1.3,  mouthType:'open',   blinkRate:0.04},
  {eyeScale:0.9,  mouthType:'smirk',  blinkRate:0.02},
  {eyeScale:1.1,  mouthType:'hehe',   blinkRate:0.035},
  {eyeScale:1.0,  mouthType:'pout',   blinkRate:0.015},
  {eyeScale:1.15, mouthType:'laugh',  blinkRate:0.045},
];
const danceExprMap = {
  bounce:[0,1,5,7], twist:[2,4,5], sway:[0,5,6], hop:[1,3,7],
};
let currentExprIdx = 0;
let exprTimer = 0;
const EXPR_INTERVAL = 4;

let smoothBPM = 120;

// ── Per-pudding state ──
let puddingStates = [];

function ensurePuddingStates(n) {
  while (puddingStates.length < n) {
    puddingStates.push({
      posReady: false,
      fx: 0,
      fy: 0,
      detached: false,
      beatOffset: Math.random(),
      jitterPhase: Math.random() * Math.PI * 2,
      jitterAmp: 0.5 + Math.random() * 0.5,
      jitterSpeed: 0.8 + Math.random() * 0.4
    });
  }
  if (puddingStates.length > n) puddingStates.length = n;
}

// ── Blink ──
const blinkStates = [];
for (let i = 0; i < 8; i++) {
  blinkStates.push({
    nextBlink: 1.5 + Math.random() * 4,
    blinking: false,
    blinkTimer: 0,
    blinkDuration: 0.1 + Math.random() * 0.08,
    blinkStyle: 'shut'
  });
}
const blinkStyles = ['shut','shut','shut','squint','happy'];

// ── DRAG ──
let selectedIndex = -1;
let dragOffsetX = 0;
let dragOffsetY = 0;

// ── GAZE ──
let gazeTarget = -1;
let gazeHoldTimer = 0;
const GAZE_HOLD_SEC = 1.5;
const gazeSmooth = [];
for (let i = 0; i < 8; i++) gazeSmooth.push({ x: 0, y: 0 });

// ── Formation target position ──
function getFormationTarget(i, count, cx, cy, baseSize, beat) {
  if (count <= 1) return { x: cx, y: cy };

  const fTime = beat * 0.5;

  if (S.formation === 'circle') {
    const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
    let r = S.circleRadius;

    if (S.formationMotion === 'breathe') {
      r += Math.sin(fTime * Math.PI * 2) * 20;
    } else if (S.formationMotion === 'petal') {
      const dir = i % 2 === 0 ? 1 : -1;
      r += dir * Math.sin(fTime * Math.PI * 2) * 25;
    } else if (S.formationMotion === 'wave') {
      r += Math.sin(fTime * Math.PI * 2 + i * (Math.PI * 2 / count)) * 25;
    } else if (S.formationMotion === 'star') {
      const spike = Math.sin(fTime * Math.PI * 2 + i * (Math.PI * 2 / count));
      r += Math.pow(Math.abs(spike), 0.5) * Math.sign(spike) * 35;
    } else if (S.formationMotion === 'jitter') {
      const ps = puddingStates[i % puddingStates.length];
      if (ps) {
        r += Math.sin(fTime * Math.PI * 2 * ps.jitterSpeed + ps.jitterPhase) * 20 * ps.jitterAmp;
      }
    }

    return {
      x: cx + Math.cos(angle) * r,
      y: cy + Math.sin(angle) * r
    };
  }

  const spacing = S.spacing * baseSize;
  const baseX = cx + (i - (count - 1) / 2) * spacing;
  let x = baseX;
  let y = cy;

  if (S.formationMotion === 'wave') {
    y += Math.sin(fTime * Math.PI * 2 + i * 0.8) * baseSize * 0.22;
  } else if (S.formationMotion === 'accordion') {
    const stretch = Math.sin(fTime * Math.PI * 2) * 0.4;
    x = cx + (i - (count - 1) / 2) * spacing * (1 + stretch);
  } else if (S.formationMotion === 'seesaw') {
    const denom = ((count - 1) / 2) || 1;
    const tilt = (i - (count - 1) / 2) / denom;
    y += Math.sin(fTime * Math.PI * 2) * tilt * baseSize * 0.30;
  }

  return { x, y };
}

// ── Smooth follow ──
function updateSmoothPosition(ps, target, dt) {
  if (!ps.posReady) {
    ps.fx = target.x;
    ps.fy = target.y;
    ps.posReady = true;
    return { x: ps.fx, y: ps.fy };
  }
  const k = Math.min(1, dt * 5.0);
  ps.fx += (target.x - ps.fx) * k;
  ps.fy += (target.y - ps.fy) * k;
  return { x: ps.fx, y: ps.fy };
}

// ── GUI ──
const $=id=>document.getElementById(id);

function updateVisibleControls() {
  $('spacingCtrl').classList.toggle('hidden', S.formation !== 'line');
  $('radiusCtrl').classList.toggle('hidden', S.formation !== 'circle');
}

function updateFormationMotionOptions() {
  const sel = $('formationMotion');
  const options = FORMATION_MOTIONS[S.formation] || FORMATION_MOTIONS.line;
  sel.innerHTML = '';
  for (const opt of options) {
    const el = document.createElement('option');
    el.value = opt.value;
    el.textContent = opt.label;
    sel.appendChild(el);
  }
  if (!options.some(o => o.value === S.formationMotion)) {
    S.formationMotion = 'none';
  }
  sel.value = S.formationMotion;
  const current = options.find(o => o.value === S.formationMotion);
  $('formationMotionVal').textContent = current ? current.label : S.formationMotion;
  updateVisibleControls();
}
updateFormationMotionOptions();

// Reset：detachedフラグだけ解除。posReadyは維持することで、
// 現在位置から目標位置へupdateSmoothPositionが滑らかに補間する。
function resetAllPositions() {
  for (const ps of puddingStates) {
    ps.detached = false;
  }
}

$('dance').onchange=e=>{S.dance=e.target.value;$('danceVal').textContent=e.target.selectedOptions[0].text};
$('bpm').oninput=e=>{S.bpm=+e.target.value;$('bpmVal').textContent=e.target.value};
$('jig').oninput=e=>{S.jiggle=e.target.value/100;$('jigVal').textContent=S.jiggle.toFixed(2)};
$('sync').oninput=e=>{S.sync=e.target.value/100;$('syncVal').textContent=S.sync.toFixed(2)};
$('colBody').oninput=e=>S.colBody=e.target.value;
$('colCara').oninput=e=>S.colCara=e.target.value;
$('colBg').oninput=e=>S.colBg=e.target.value;
$('colCheek').oninput=e=>S.colCheek=e.target.value;
$('chkA').oninput=e=>{S.cheekAlpha=e.target.value/100;$('chkAVal').textContent=S.cheekAlpha.toFixed(2)};
$('cnt').oninput=e=>{
  S.count=+e.target.value;
  $('cntVal').textContent=e.target.value;
};
$('spc').oninput=e=>{S.spacing=e.target.value/10;$('spcVal').textContent=S.spacing.toFixed(1)};
$('radius').oninput=e=>{S.circleRadius=+e.target.value;$('radVal').textContent=e.target.value};
$('formation').onchange=e=>{
  S.formation=e.target.value;
  S.formationMotion='none';
  $('formationVal').textContent=e.target.selectedOptions[0].text;
  updateFormationMotionOptions();
};
$('formationMotion').onchange=e=>{
  S.formationMotion=e.target.value;
  const options = FORMATION_MOTIONS[S.formation] || [];
  const current = options.find(o => o.value === S.formationMotion);
  $('formationMotionVal').textContent = current ? current.label : S.formationMotion;
};
$('autoInt').oninput=e=>{S.autoInterval=+e.target.value;$('intVal').textContent=e.target.value};
$('btnManual').onclick=()=>{S.auto=false;$('btnManual').classList.add('on');$('btnAuto').classList.remove('on')};
$('btnAuto').onclick=()=>{S.auto=true;$('btnAuto').classList.add('on');$('btnManual').classList.remove('on')};
$('btnReset').onclick=()=>{ resetAllPositions(); };
$('lockBpm').onchange=e=>{S.lockBpm=e.target.checked};

window.addEventListener('wheel', e => {
  if (e.target.closest('#gui')) return;
  S.zoom = Math.max(0.4, Math.min(3.0, S.zoom - e.deltaY * 0.001));
}, {passive:true});

// ── Catmull-Rom ──
function catmullRomPoints(controlPts, segments) {
  const out = [];
  const n = controlPts.length;
  for (let i = 0; i < n; i++) {
    const p0 = controlPts[(i-1+n)%n];
    const p1 = controlPts[i];
    const p2 = controlPts[(i+1)%n];
    const p3 = controlPts[(i+2)%n];
    for (let s = 0; s < segments; s++) {
      const t = s/segments, t2=t*t, t3=t2*t;
      out.push({
        x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
      });
    }
  }
  return out;
}

function makePuddingOutline(w, h, bodyTop, bodyBot, jig) {
  const topW = w*0.58 + jig(7,w*0.04);
  const botW = w*1.05 + jig(5,w*0.03);
  const cp = [];
  for(let i=0;i<=7;i++){
    const a=Math.PI-(Math.PI*i/7);
    cp.push({x:Math.cos(a)*botW/2+jig(5+a,1.5), y:bodyBot+Math.sin(a)*h*0.05});
  }
  for(let i=1;i<=3;i++){
    const t=i/4;
    cp.push({x:botW/2+(topW/2-botW/2)*t+Math.sin(t*Math.PI)*w*0.03+jig(9+t,1.5), y:bodyBot+(bodyTop-bodyBot)*t});
  }
  for(let i=0;i<=5;i++){
    const a=(i/5)*Math.PI;
    cp.push({x:Math.cos(a)*topW/2+jig(6+a,1.5), y:bodyTop-Math.sin(a)*h*0.08+jig(10,1)});
  }
  for(let i=1;i<=3;i++){
    const t=i/4;
    cp.push({x:-topW/2+(-botW/2+topW/2)*t-Math.sin(t*Math.PI)*w*0.03+jig(8+t,1.5), y:bodyTop+(bodyBot-bodyTop)*t});
  }
  return {pts:catmullRomPoints(cp,4), bodyTop};
}

// ── p5 sketch ──
new p5(sk => {
  let t = 0;
  let beatAccum = 0;

  sk.setup = () => {
    const c = sk.createCanvas(sk.windowWidth, sk.windowHeight);
    c.style('display','block');
  };

  sk.windowResized = () => {
    sk.resizeCanvas(sk.windowWidth, sk.windowHeight);
    for (const ps of puddingStates) {
      if (!ps.detached) ps.posReady = false;
    }
  };

  sk.mousePressed = () => {
    if (document.elementFromPoint(sk.mouseX, sk.mouseY)?.closest('#gui, #guiToggle')) return;
    const baseSize = Math.min(sk.width, sk.height) * 0.16 * S.zoom;
    const hitRadius = baseSize * 0.7;
    let closestDist = Infinity;
    let closestIdx = -1;
    for (let i = 0; i < puddingStates.length; i++) {
      const ps = puddingStates[i];
      if (!ps.posReady) continue;
      const dx = sk.mouseX - ps.fx;
      const dy = sk.mouseY - ps.fy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < hitRadius && dist < closestDist) {
        closestDist = dist;
        closestIdx = i;
      }
    }
    if (closestIdx >= 0) {
      selectedIndex = closestIdx;
      const ps = puddingStates[closestIdx];
      dragOffsetX = ps.fx - sk.mouseX;
      dragOffsetY = ps.fy - sk.mouseY;
      gazeTarget = closestIdx;
      gazeHoldTimer = 0;
      ps.detached = true;
    }
  };

  sk.mouseDragged = () => {
    if (selectedIndex >= 0 && selectedIndex < puddingStates.length) {
      const ps = puddingStates[selectedIndex];
      ps.fx = sk.mouseX + dragOffsetX;
      ps.fy = sk.mouseY + dragOffsetY;
      ps.posReady = true;
    }
  };

  sk.mouseReleased = () => {
    if (selectedIndex >= 0) {
      gazeHoldTimer = GAZE_HOLD_SEC;
    }
    selectedIndex = -1;
  };

  sk.draw = () => {
    const dt = sk.deltaTime/1000;
    t += dt;
    smoothBPM += (S.bpm-smoothBPM)*Math.min(1,dt*3);
    sk.background(S.colBg);

    ensurePuddingStates(S.count);

    exprTimer += dt;
    if(exprTimer > EXPR_INTERVAL){
      exprTimer = 0;
      const pool = danceExprMap[S.dance]||[0];
      currentExprIdx = pool[Math.floor(Math.random()*pool.length)];
    }

    if(S.auto){
      S.autoTimer += dt;
      if(S.autoTimer > S.autoInterval){
        S.autoTimer = 0;

        S.dance = danceList[Math.floor(Math.random()*danceList.length)];
        $('dance').value=S.dance;
        $('danceVal').textContent=$('dance').selectedOptions[0].text;

        const formations = ['line','circle'];
        S.formation = formations[Math.floor(Math.random()*formations.length)];
        $('formation').value=S.formation;
        $('formationVal').textContent=$('formation').selectedOptions[0].text;
        updateFormationMotionOptions();

        const motions = FORMATION_MOTIONS[S.formation];
        S.formationMotion = motions[Math.floor(Math.random()*motions.length)].value;
        $('formationMotion').value = S.formationMotion;
        const currentMotion = motions.find(o => o.value === S.formationMotion);
        $('formationMotionVal').textContent = currentMotion ? currentMotion.label : S.formationMotion;

        // Lock BPMがOFFのときだけBPMをランダム変更
        if (!S.lockBpm) {
          S.bpm = 80+Math.floor(Math.random()*70);
          $('bpm').value=S.bpm; $('bpmVal').textContent=S.bpm;
        }
      }
    }

    for(let i=0;i<blinkStates.length;i++){
      const bs = blinkStates[i];
      if(bs.blinking){
        bs.blinkTimer += dt;
        if(bs.blinkTimer >= bs.blinkDuration){
          bs.blinking = false;
          bs.nextBlink = 1.5 + Math.random()*4;
          bs.blinkDuration = 0.08 + Math.random()*0.1;
          bs.blinkStyle = blinkStyles[Math.floor(Math.random()*blinkStyles.length)];
        }
      } else {
        bs.nextBlink -= dt;
        if(bs.nextBlink <= 0) {
          bs.blinking = true;
          bs.blinkTimer = 0;
        }
      }
    }

    if (selectedIndex < 0 && gazeTarget >= 0) {
      gazeHoldTimer -= dt;
      if (gazeHoldTimer <= 0) gazeTarget = -1;
    }

    const beatSec = 60/smoothBPM;
    beatAccum += dt/beatSec;
    const beat = beatAccum;
    const cx = sk.width/2;
    const cy = sk.height*0.58;
    const baseSize = Math.min(sk.width,sk.height)*0.16*S.zoom;

    const drawItems = [];
    for (let i = 0; i < S.count; i++) {
      const ps = puddingStates[i];
      let pos;
      if (ps.detached) {
        pos = { x: ps.fx, y: ps.fy };
      } else if (i === selectedIndex) {
        pos = { x: ps.fx, y: ps.fy };
      } else {
        const target = getFormationTarget(i, S.count, cx, cy, baseSize, beat);
        pos = updateSmoothPosition(ps, target, dt);
      }
      // Sync極大テスト：×4 で最大4ビート分ズレる
      const personalBeat = beat + ps.beatOffset * S.sync * 4;
      drawItems.push({ idx: i, x: pos.x, y: pos.y, personalBeat });
    }

    if (S.formation === 'circle') {
      drawItems.sort((a, b) => a.y - b.y);
    } else {
      drawItems.sort((a, b) => a.idx - b.idx);
    }

    for (const item of drawItems) {
      drawPudding(sk, item.x, item.y, baseSize, t, item.personalBeat + item.idx*0.35, item.idx, dt);
    }
  };

  function drawPudding(sk, px, py, size, time, beat, idx, dt) {
    sk.push();
    sk.translate(px, py);

    const expr = facePool[currentExprIdx];
    const bs = blinkStates[idx % blinkStates.length];
    let dy=0, rot=0, scX=1, scY=1;
    const phase = beat*Math.PI*2;

    switch(S.dance){
      case 'bounce':
        dy=-Math.abs(Math.sin(phase))*size*0.35;
        scY=1+Math.abs(Math.sin(phase))*0.1;
        scX=1-Math.abs(Math.sin(phase))*0.06;
        rot=Math.sin(phase*0.5)*0.12; break;
      case 'twist':
        dy=-Math.abs(Math.sin(phase))*size*0.15;
        scX=1+Math.sin(phase)*0.15;
        scY=1-Math.sin(phase)*0.08;
        rot=Math.sin(phase*0.5)*0.08; break;
      case 'sway':
        sk.translate(Math.sin(phase*0.5)*size*0.3,0);
        dy=-Math.abs(Math.sin(phase))*size*0.1;
        rot=Math.sin(phase*0.5)*0.22; break;
      case 'hop':
        dy=-Math.max(0,Math.sin(phase))*size*0.55;
        rot=Math.sin(phase*0.5)*0.15;
        scY=dy<-size*0.05?1.08:0.9;
        scX=dy<-size*0.05?0.93:1.08; break;
    }

    sk.translate(0,dy);
    sk.rotate(rot);
    sk.scale(scX,scY);

    const w=size, h=size*0.85;
    const j=S.jiggle;
    const jig=(freq,amp)=>Math.sin(time*freq+idx*2)*amp*j;
    const bodyTop=-h*0.45, bodyBot=h*0.4;

    const outline = makePuddingOutline(w,h,bodyTop,bodyBot,jig);
    const pts = outline.pts;

    sk.noStroke(); sk.fill(S.colBody);
    sk.beginShape();
    for(const p of pts) sk.vertex(p.x,p.y);
    sk.endShape(sk.CLOSE);

    sk.drawingContext.save();
    sk.drawingContext.beginPath();
    for(let i=0;i<pts.length;i++){
      if(i===0) sk.drawingContext.moveTo(pts[i].x,pts[i].y);
      else sk.drawingContext.lineTo(pts[i].x,pts[i].y);
    }
    sk.drawingContext.closePath();
    sk.drawingContext.clip();
    sk.fill(S.colCara);
    sk.rect(-w, bodyTop-h*0.2, w*2, (bodyTop+h*0.06)-(bodyTop-h*0.2));
    sk.drawingContext.restore();

    const eyeY=-h*0.05+jig(2,1.5);
    const eyeSpacing=w*0.17;
    const eyeBase=size*0.06;
    const es=expr.eyeScale;
    const maxLook = eyeBase * 0.9;

    const isGazing = (gazeTarget === idx);

    let targetLookX, targetLookY;
    if (isGazing) {
      const localMX = (sk.mouseX - px) / scX;
      const localMY = (sk.mouseY - py - dy) / scY;
      const dxL = localMX;
      const dyL = localMY - eyeY;
      const dist = Math.sqrt(dxL * dxL + dyL * dyL) || 1;
      const strength = Math.min(1, dist / (size * 0.5));
      targetLookX = (dxL / dist) * maxLook * strength;
      targetLookY = (dyL / dist) * maxLook * strength * 0.7;
    } else {
      targetLookX = Math.sin(time*1.3+idx)*2.5;
      targetLookY = Math.cos(time*0.9+idx)*1.5;
    }

    const gs = gazeSmooth[idx % gazeSmooth.length];
    const lerpSpeed = isGazing ? 10 : 4;
    gs.x += (targetLookX - gs.x) * Math.min(1, dt * lerpSpeed);
    gs.y += (targetLookY - gs.y) * Math.min(1, dt * lerpSpeed);
    const lookX = gs.x;
    const lookY = gs.y;

    const isBlinking = bs.blinking;
    const bStyle = bs.blinkStyle;

    sk.noStroke();

    if(isBlinking){
      sk.stroke(40,30,20,180);
      sk.strokeWeight(1.8);
      sk.noFill();
      const ew = eyeBase*2.5*es;
      if(bStyle === 'shut'){
        sk.line(-eyeSpacing-ew/2, eyeY, -eyeSpacing+ew/2, eyeY);
        sk.line(eyeSpacing-ew/2, eyeY, eyeSpacing+ew/2, eyeY);
      } else if(bStyle === 'squint'){
        sk.arc(-eyeSpacing, eyeY-2, ew, eyeBase*1.2, 0.2, Math.PI-0.2);
        sk.arc(eyeSpacing, eyeY-2, ew, eyeBase*1.2, 0.2, Math.PI-0.2);
      } else if(bStyle === 'happy'){
        sk.arc(-eyeSpacing, eyeY+2, ew, eyeBase*1.5, Math.PI+0.3, -0.3);
        sk.arc(eyeSpacing, eyeY+2, ew, eyeBase*1.5, Math.PI+0.3, -0.3);
      }
      sk.noStroke();
    } else {
      sk.fill(255);
      sk.push(); sk.translate(-eyeSpacing,eyeY);
      sk.ellipse(0,0,eyeBase*2.5*es,eyeBase*2.8*es); sk.pop();
      sk.push(); sk.translate(eyeSpacing,eyeY);
      sk.ellipse(0,0,eyeBase*2.5*es,eyeBase*2.8*es); sk.pop();

      sk.fill(25);
      sk.ellipse(-eyeSpacing+lookX,eyeY+lookY,eyeBase*1.5*es,eyeBase*1.7*es);
      sk.ellipse(eyeSpacing+lookX,eyeY+lookY,eyeBase*1.5*es,eyeBase*1.7*es);
      sk.fill(255);
      sk.ellipse(-eyeSpacing+lookX-1.5,eyeY+lookY-1.5,eyeBase*0.55,eyeBase*0.55);
      sk.ellipse(eyeSpacing+lookX-1.5,eyeY+lookY-1.5,eyeBase*0.55,eyeBase*0.55);
    }

    const cheekCol = sk.color(S.colCheek);
    cheekCol.setAlpha(S.cheekAlpha * 255);
    sk.fill(cheekCol);
    sk.ellipse(-eyeSpacing-w*0.13, eyeY+size*0.08, size*0.15, size*0.09);
    sk.ellipse(eyeSpacing+w*0.13, eyeY+size*0.08, size*0.15, size*0.09);

    const mouthY=eyeY+size*0.12;
    const mSize=size*0.05;
    switch(expr.mouthType){
      case 'smile':
        sk.noFill();sk.stroke(80,50,30,130);sk.strokeWeight(1.5);
        sk.arc(0,mouthY,mSize*2,mSize*1.2,0.1,Math.PI-0.1);break;
      case 'grin':
        sk.noFill();sk.stroke(80,50,30,130);sk.strokeWeight(1.5);
        sk.arc(0,mouthY,mSize*2.8,mSize*1.8,0.05,Math.PI-0.05);break;
      case 'oh':
        sk.noStroke();sk.fill(80,50,30,100);
        sk.ellipse(0,mouthY,mSize*1.2,mSize*1.6);break;
      case 'open':
        sk.noStroke();sk.fill(80,50,30,120);
        sk.ellipse(0,mouthY,mSize*2,mSize*2.4);
        sk.fill(255,100,120,70);
        sk.ellipse(0,mouthY+mSize*0.4,mSize*0.8,mSize*0.5);break;
      case 'smirk':
        sk.noFill();sk.stroke(80,50,30,130);sk.strokeWeight(1.5);
        sk.arc(mSize*0.3,mouthY,mSize*1.8,mSize*1.0,0.2,Math.PI*0.7);break;
      case 'hehe':
        sk.noStroke();sk.fill(80,50,30,110);
        sk.arc(0,mouthY,mSize*2.2,mSize*1.6,0,Math.PI,sk.CHORD);break;
      case 'pout':
        sk.noFill();sk.stroke(80,50,30,130);sk.strokeWeight(1.5);
        sk.arc(0,mouthY+mSize*0.3,mSize*1.4,mSize*0.8,Math.PI+0.2,-0.2);break;
      case 'laugh':
        sk.noStroke();sk.fill(80,50,30,130);
        sk.arc(0,mouthY,mSize*2.8,mSize*2.2,0,Math.PI,sk.CHORD);
        sk.fill(255,100,120,80);
        sk.ellipse(0,mouthY+mSize*0.5,mSize*1.0,mSize*0.5);break;
    }
    sk.noStroke();
    sk.pop();
  }
});
</script>
