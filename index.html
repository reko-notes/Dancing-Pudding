<style>

canvas{display:block}
#guiToggle{position:fixed;top:16px;right:16px;z-index:20;background:rgba(15,15,30,0.85);
  color:#eee;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 12px;
  cursor:pointer;font-size:18px;backdrop-filter:blur(8px);line-height:1}
#guiToggle:hover{background:rgba(40,40,60,0.9)}
#gui{position:fixed;top:52px;right:16px;width:260px;background:rgba(15,15,30,0.92);
  padding:14px 18px;border-radius:10px;color:#eee;font-size:13px;

.ctrl{margin-bottom:4px;padding:4px 0;cursor:default}

.ctrl label{display:block;margin-bottom:2px;font-size:11px;opacity:0.7}
.ctrl .v{float:right;font-family:monospace;font-size:11px;opacity:0.5}

.lock:hover{opacity:1.0}

.ctrl.locked input[type=range]{opacity:0.4;pointer-events:none}
input[type=range]{width:100%;height:22px;cursor:pointer;padding:0}
select{width:100%;padding:4px;background:#111;color:#eee;border:1px solid #333;border-radius:5px}

#mediaPreview{position:fixed;bottom:16px;left:16px;z-index:15;
  background:rgba(15,15,30,0.85);border:1px solid rgba(255,255,255,0.1);border-radius:8px;
  padding:6px;backdrop-filter:blur(8px);display:none;max-width:220px}
#mediaPreview.visible{display:block}

#mediaPreview audio{width:200px;display:block}
#mediaPreview .fname{color:#ccc;font-size:11px;margin-top:4px;font-family:system-ui,sans-serif;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

<body>
<div id="guiToggle">🍮</div>
<div id="gui">
  <h3>🍮 PUDDING</h3>

  <div class="sep">BASIC</div>

  <div class="ctrl">
    <label>Dance <span class="v" id="danceVal">Bounce</span></label>
    <select id="dance">
      <option value="bounce">Bounce</option>
      <option value="twist">Twist</option>
      <option value="sway">Sway</option>
      <option value="hop">Hop</option>
    </select>
  </div>

  <div class="ctrl">
    <label>BPM <span class="v" id="bpmVal">120</span><span class="lock" data-target="bpm">🔓</span></label>
    <input type="range" id="bpm" min="60" max="150" value="120">
  </div>

  <div class="ctrl">
    <label>Jiggle <span class="v" id="jigVal">0.60</span><span class="lock" data-target="jiggle">🔓</span></label>
    <input type="range" id="jig" min="0" max="100" value="60">
  </div>

  <div class="ctrl">
    <label>Sync <span class="v" id="syncVal">1.00</span><span class="lock" data-target="sync">🔓</span></label>
    <input type="range" id="sync" min="0" max="100" value="100">
  </div>

  <div class="ctrl">
    <label>Puddings <span class="v" id="cntVal">1</span><span class="lock" data-target="count">🔓</span></label>
    <input type="range" id="cnt" min="1" max="9" step="2" value="1">
  </div>

  <button id="btnAudio">🎤 Enable Audio Input</button>
  <button id="btnFile">📁 Load Audio/Video File</button>
  <input type="file" id="fileInput" accept="audio/*,video/*">

  <div class="sep">FORMATION</div>

  <div class="ctrl">
    <label>Formation <span class="v" id="formationVal">Line</span></label>
    <select id="formation">
      <option value="line">Line</option>
      <option value="circle">Circle</option>
      <option value="grid">Grid</option>

  <div class="ctrl">
    <label>Motion <span class="v" id="motionVal">None</span></label>
    <select id="motion">
      <option value="none">None</option>
      <option value="wave">Wave</option>
      <option value="accordion">Accordion</option>
      <option value="seesaw">Seesaw</option>

  <div class="ctrl" id="spacingCtrl">
    <label>Spacing <span class="v" id="spcVal">1.6</span><span class="lock" data-target="spacing">🔓</span></label>
    <input type="range" id="spc" min="10" max="30" value="16">

    <label>Circle Radius <span class="v" id="radVal">200</span><span class="lock" data-target="radius">🔓</span></label>
    <input type="range" id="radius" min="80" max="500" step="10" value="200">

  <button id="btnReset">Reset Positions</button>

  <div class="sep">APPEARANCE</div>

  <div class="ctrl">
    <label>Pudding</label>
    <input type="color" id="colBody" value="#f4b860">
  </div>
  <div class="ctrl">
    <label>Caramel</label>
    <input type="color" id="colCara" value="#8b4513">
  </div>
  <div class="ctrl">
    <label>Background</label>
    <input type="color" id="colBg" value="#1a1a2e">
  </div>
  <div class="ctrl">
    <label>Cheek</label>
    <input type="color" id="colCheek" value="#ff6464">
  </div>
  <div class="ctrl">
    <label>Cheek Alpha <span class="v" id="chkAVal">0.31</span><span class="lock" data-target="cheekAlpha">🔓</span></label>
    <input type="range" id="chkA" min="0" max="100" value="31">
  </div>

  <div class="sep">AUTOMATION</div>

  <button id="btnManual" class="on">Manual</button>
  <button id="btnAuto">Auto</button>

  <div class="ctrl" style="margin-top:8px">
    <label>Auto Interval <span class="v" id="intVal">6</span>s<span class="lock" data-target="autoInterval">🔓</span></label>
    <input type="range" id="autoInt" min="3" max="20" value="6">
  </div>
</div>

<div id="mediaPreview">
  <div id="mediaContainer"></div>
  <div class="fname" id="fileName"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
// ── GUI toggle ──
const guiEl = document.getElementById('gui');
const toggleEl = document.getElementById('guiToggle');
let guiVisible = true;
toggleEl.onclick = () => {
  guiVisible = !guiVisible;
  guiEl.classList.toggle('hidden', !guiVisible);
};

// ── Formation & Motion lists ──
const FORMATIONS = ['line','circle','grid','vshape','zigzag','spiral'];
const MOTIONS = ['none','wave','accordion','seesaw','breathe','petal','star','jitter','orbit','drift','pulse','depthwave'];
const MOTION_LABELS = {
  none:'None', wave:'Wave', accordion:'Accordion', seesaw:'Seesaw',
  breathe:'Breathe', petal:'Petal', star:'Star', jitter:'Jitter',
  orbit:'Orbit', drift:'Drift', pulse:'Pulse', depthwave:'Depth Wave'
};

// ── State ──
const S = {
  dance:'bounce', bpm:120, jiggle:0.6,
  sync:1.0,
  colBody:'#f4b860', colCara:'#8b4513', colBg:'#1a1a2e',
  colCheek:'#ff6464', cheekAlpha:0.31,
  count:1,
  spacing:1.6,
  formation:'line',
  motion:'none',
  circleRadius:200,
  auto:false, autoTimer:0, autoInterval:6,
  zoom:1.0,
  audioLevel: 0,
  beatLevel: 0,
  afterglow: 0,
  listeningMode: 0,
  listeningBlend: 0,
  timeSinceSound: 999,
  noiseFloor: 0.015,
  bassFloor: 0.04,
  prevBassRaw: 0,
  micCalibration: 0,

  // マイク発話用。ジャンプではなく、接地した上体の変形へ使う。
  voicePresence: 0,
  voiceBrightness: 0.45,
  prevVoiceBrightness: 0.45,
  prevVoiceLevel: 0,
  voiceSilence: 999,
  voiceCooldown: 0,
  voiceLean: 0,
  voiceLeanVel: 0,
  voiceShape: 0,
  voiceShapeVel: 0,
  voiceAccentDir: 1,
  locks: {
    bpm:false, jiggle:false, sync:false, count:false,
    spacing:false, radius:false, cheekAlpha:false, autoInterval:false
  }
};
const danceList = ['bounce','twist','sway','hop'];

// ── Audio Input (共通) ──
let audioCtx = null;
let analyser = null;
let dataArray = null;
let freqArray = null;
let audioSourceType = null;
let micStream = null;
let micSourceNode = null;
let micHighpassNode = null;
let fileSourceNode = null;
let mediaEl = null;

function isAudioAnalysisActive() {
  if (audioSourceType === 'mic') return !!micStream;
  if (audioSourceType === 'file') {
    return !!mediaEl && !mediaEl.paused && !mediaEl.ended && mediaEl.readyState >= 2;
  }
  return false;
}

function resetAudioMotionState(startGracePeriod = false) {
  S.audioLevel = 0;
  S.beatLevel = 0;
  S.afterglow = 0;
  S.timeSinceSound = startGracePeriod ? 0 : 999;
  S.listeningMode = 0;
  S.listeningBlend = 0;
  S.prevBassRaw = 0;

  S.voicePresence = 0;
  S.voiceBrightness = 0.45;
  S.prevVoiceBrightness = 0.45;
  S.prevVoiceLevel = 0;
  S.voiceSilence = 999;
  S.voiceCooldown = 0;
  S.voiceLean = 0;
  S.voiceLeanVel = 0;
  S.voiceShape = 0;
  S.voiceShapeVel = 0;
  S.voiceAccentDir = 1;
}

function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.8;
    dataArray = new Uint8Array(analyser.fftSize);
    freqArray = new Uint8Array(analyser.frequencyBinCount);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function disconnectCurrentSource() {
  if (micSourceNode) {
    try { micSourceNode.disconnect(); } catch(e) {}
    micSourceNode = null;
  }
  if (micHighpassNode) {
    try { micHighpassNode.disconnect(); } catch(e) {}
    micHighpassNode = null;
  }
  if (micStream) {
    try { micStream.getTracks().forEach(t => t.stop()); } catch(e) {}
    micStream = null;
  }
  if (fileSourceNode) {
    try { fileSourceNode.disconnect(); } catch(e) {}
    fileSourceNode = null;
  }
  if (mediaEl) {
    try { mediaEl.pause(); mediaEl.src = ''; } catch(e) {}
    const container = document.getElementById('mediaContainer');
    if (container) container.innerHTML = '';
    document.getElementById('mediaPreview').classList.remove('visible');
    mediaEl = null;
  }
  audioSourceType = null;
  S.micCalibration = 0;
  S.noiseFloor = 0.015;
  S.bassFloor = 0.04;
  resetAudioMotionState(false);
}

function updateButtonStates() {
  const btnAudio = document.getElementById('btnAudio');
  const btnFile = document.getElementById('btnFile');

  btnAudio.classList.remove('audio-on');
  btnFile.classList.remove('file-on');
  btnAudio.textContent = '🎤 Enable Audio Input';
  btnFile.textContent = '📁 Load Audio/Video File';

  if (audioSourceType === 'mic') {
    btnAudio.textContent = '🎤 Audio OFF';
    btnAudio.classList.add('audio-on');
  } else if (audioSourceType === 'file') {
    btnFile.textContent = '📁 File OFF';
    btnFile.classList.add('file-on');
  }
}

async function toggleMic() {
  if (audioSourceType === 'mic') {
    disconnectCurrentSource();
    updateButtonStates();
    console.log('Mic input disabled');
    return;
  }
  try {
    ensureAudioCtx();
    disconnectCurrentSource();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: false,
        channelCount: 1
      }
    });
    micStream = stream;
    micSourceNode = audioCtx.createMediaStreamSource(stream);

    // 空調・扇風機・机の振動など、低すぎる連続音を先に弱める。
    micHighpassNode = audioCtx.createBiquadFilter();
    micHighpassNode.type = 'highpass';
    micHighpassNode.frequency.value = 75;
    micHighpassNode.Q.value = 0.7;
    micSourceNode.connect(micHighpassNode);
    micHighpassNode.connect(analyser);

    audioSourceType = 'mic';
    S.noiseFloor = 0.015;
    S.bassFloor = 0.04;
    S.micCalibration = 1.2;
    resetAudioMotionState(true);
    updateButtonStates();
    console.log('Mic input enabled');
  } catch (err) {
    console.error('Mic input failed:', err);
    alert('マイク許可が取れませんでした: ' + err.message);
  }
}

function toggleFile() {
  if (audioSourceType === 'file') {
    disconnectCurrentSource();
    updateButtonStates();
    console.log('File input disabled');
    return;
  }
  document.getElementById('fileInput').click();
}

function loadMediaFile(file) {
  if (!file) return;
  try {
    ensureAudioCtx();
    disconnectCurrentSource();

    const isVideo = file.type.startsWith('video/');
    const url = URL.createObjectURL(file);
    const container = document.getElementById('mediaContainer');
    container.innerHTML = '';

    const el = document.createElement(isVideo ? 'video' : 'audio');
    el.src = url;
    el.controls = true;
    el.loop = true;
    el.crossOrigin = 'anonymous';
    if (isVideo) {
      el.playsInline = true;
    }
    container.appendChild(el);
    mediaEl = el;

    document.getElementById('fileName').textContent = file.name;
    document.getElementById('mediaPreview').classList.add('visible');

    fileSourceNode = audioCtx.createMediaElementSource(el);
    fileSourceNode.connect(analyser);
    fileSourceNode.connect(audioCtx.destination);

    audioSourceType = 'file';
    resetAudioMotionState(true);
    updateButtonStates();

    // ファイルは「読み込まれているか」ではなく「再生中か」で音モードを切り替える。
    // プレイヤーを一時停止したら通常ダンスへ戻り、再生すると音反応へ復帰する。
    el.addEventListener('play', () => {
      resetAudioMotionState(true);
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    });
    el.addEventListener('pause', () => {
      resetAudioMotionState(true);
    });
    el.addEventListener('ended', () => {
      resetAudioMotionState(true);
    });

    el.play().catch(err => console.warn('Autoplay blocked, click play manually:', err));
    console.log('File loaded:', file.name);
  } catch (err) {
    console.error('File load failed:', err);
    alert('ファイル読み込みに失敗しました: ' + err.message);
  }
}

// ── 音の解析 ──
const LISTENING_HOLD_SEC = 5.0;
const LISTENING_FADE_START_SEC = 4.0;
const LISTENING_EXIT_SPEED = 11.0;
const LISTENING_TRIGGER = 0.18;
const SOUND_PRESENT_TRIGGER = 0.10;
const BASS_PRESENT_TRIGGER = 0.16;

const clamp01 = v => Math.max(0, Math.min(1, v));
const smooth01 = v => {
  const x = clamp01(v);
  return x * x * (3 - 2 * x);
};

function updateVoiceBodyMotion(dt, isMic, calibrating, boosted, bassBoost, brightness) {
  const voiceNow = isMic && !calibrating && boosted > 0.075;
  const previousSilence = S.voiceSilence;
  S.voiceSilence = voiceNow ? 0 : S.voiceSilence + dt;
  S.voiceCooldown = Math.max(0, S.voiceCooldown - dt);

  const presenceTarget = voiceNow ? clamp01((boosted - 0.055) * 1.65) : 0;
  const presenceRate = presenceTarget > S.voicePresence ? 12 : 6.5;
  S.voicePresence += (presenceTarget - S.voicePresence) * Math.min(1, dt * presenceRate);

  const brightnessRate = voiceNow ? 7.5 : 2.5;
  S.voiceBrightness += (brightness - S.voiceBrightness) * Math.min(1, dt * brightnessRate);

  const onset = Math.max(0, boosted - S.prevVoiceLevel);
  const brightnessDelta = S.voiceBrightness - S.prevVoiceBrightness;
  const timbreShift = Math.abs(brightnessDelta);
  const phraseStart = voiceNow && previousSilence > 0.16;
  const lowAccent = Math.max(0, bassBoost - 0.26);

  // 全フレームをイベント化しない。文節開始・明確な音量差・音色差だけを拾う。
  const salience = Math.max(
    phraseStart ? 0.78 : 0,
    onset * 3.2,
    timbreShift * 4.0,
    lowAccent * 0.95
  );

  const dynamicThreshold = 0.24 + S.voicePresence * 0.08;
  if (voiceNow && S.voiceCooldown <= 0 && salience > dynamicThreshold) {
    let dir = 0;
    if (brightnessDelta > 0.012) dir = 1;
    else if (brightnessDelta < -0.012) dir = -1;
    else {
      S.voiceAccentDir *= -1;
      dir = S.voiceAccentDir;
    }

    const impulse = Math.min(1, salience);
    S.voiceLeanVel += dir * (0.34 + impulse * 0.52);
    S.voiceShapeVel += 0.32 + impulse * 0.72;

    // 強い声ほど少し長く間引く。小さな連続変化は presence が担当する。
    S.voiceCooldown = 0.20 + impulse * 0.18;
  }

  // 声の明るさは上体のごく小さな方向性、音量は伸び縮みの基礎値へ。
  const leanTarget = voiceNow
    ? (S.voiceBrightness - 0.48) * 0.035 * (0.35 + S.voicePresence)
    : 0;
  const shapeTarget = voiceNow
    ? 0.012 + S.voicePresence * 0.040 + (S.voiceBrightness - 0.45) * 0.012
    : 0;

  const leanAccel = (leanTarget - S.voiceLean) * 24 - S.voiceLeanVel * 8.0;
  S.voiceLeanVel += leanAccel * dt;
  S.voiceLean += S.voiceLeanVel * dt;
  S.voiceLean = Math.max(-0.105, Math.min(0.105, S.voiceLean));

  const shapeAccel = (shapeTarget - S.voiceShape) * 34 - S.voiceShapeVel * 9.0;
  S.voiceShapeVel += shapeAccel * dt;
  S.voiceShape += S.voiceShapeVel * dt;
  S.voiceShape = Math.max(-0.035, Math.min(0.105, S.voiceShape));

  S.prevVoiceLevel = boosted;
  S.prevVoiceBrightness = S.voiceBrightness;
}

function updateAudioLevel(dt) {
  const analysisActive = isAudioAnalysisActive();

  // ファイル一時停止中／音入力OFF中は通常ダンスへ戻す。
  if (!analysisActive || !analyser || !dataArray || !freqArray) {
    S.audioLevel += (0 - S.audioLevel) * Math.min(1, dt * 12);
    S.beatLevel += (0 - S.beatLevel) * Math.min(1, dt * 14);
    S.afterglow = Math.max(0, S.afterglow - dt * 5);
    S.timeSinceSound = 0;
    S.listeningMode = 0;
    S.listeningBlend += (0 - S.listeningBlend) * Math.min(1, dt * LISTENING_EXIT_SPEED);
    updateVoiceBodyMotion(dt, false, false, 0, 0, 0.45);
    return;
  }

  analyser.getByteTimeDomainData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = (dataArray[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / dataArray.length);
  const isMic = audioSourceType === 'mic';
  const calibrating = isMic && S.micCalibration > 0;

  let boosted = 0;
  if (isMic) {
    if (calibrating) {
      const a = Math.min(1, dt * 6);
      S.noiseFloor += (rms - S.noiseFloor) * a;
      S.micCalibration = Math.max(0, S.micCalibration - dt);
    } else {
      const nearFloor = rms < S.noiseFloor * 1.7 + 0.01;
      if (nearFloor) {
        const rate = rms < S.noiseFloor ? 1.8 : 0.18;
        S.noiseFloor += (rms - S.noiseFloor) * Math.min(1, dt * rate);
      }
    }

    const gate = Math.max(0.012, S.noiseFloor * 1.65 + 0.006);
    const gatedRms = rms > gate ? rms - gate : 0;
    boosted = calibrating ? 0 : Math.min(1, gatedRms * 10);
  } else {
    // ファイル音源は、印象が良かった版の感度を維持する。
    const gatedRms = rms > 0.004 ? rms - 0.004 : 0;
    boosted = Math.min(1, gatedRms * 6.5);
  }

  const audioFollow = boosted > S.audioLevel ? 0.50 : Math.min(1, dt * 5.5);
  S.audioLevel += (boosted - S.audioLevel) * audioFollow;

  analyser.getByteFrequencyData(freqArray);
  const hzPerBin = audioCtx.sampleRate / analyser.fftSize;
  const bassStart = Math.max(1, Math.floor(55 / hzPerBin));
  const bassEnd = Math.min(freqArray.length, Math.ceil(220 / hzPerBin));
  let bassSum = 0;
  for (let i = bassStart; i < bassEnd; i++) bassSum += freqArray[i];
  const bassRaw = bassSum / Math.max(1, bassEnd - bassStart) / 255;

  let bassBoost = 0;
  if (isMic) {
    if (calibrating) {
      const a = Math.min(1, dt * 6);
      S.bassFloor += (bassRaw - S.bassFloor) * a;
    } else if (bassRaw < S.bassFloor * 1.7 + 0.035) {
      const rate = bassRaw < S.bassFloor ? 1.5 : 0.15;
      S.bassFloor += (bassRaw - S.bassFloor) * Math.min(1, dt * rate);
    }

    const bassGate = S.bassFloor * 1.5 + 0.025;
    const excess = Math.max(0, bassRaw - bassGate);
    const transient = Math.max(0, bassRaw - S.prevBassRaw);
    bassBoost = calibrating ? 0 : Math.min(1, excess * 4.5 + transient * 5.5);
  } else {
    // ファイルのキック感は基準版どおり。
    bassBoost = Math.min(1, bassRaw * 2.5);
  }
  S.prevBassRaw = bassRaw;

  const beatFollow = bassBoost > S.beatLevel ? 0.68 : Math.min(1, dt * 8);
  S.beatLevel += (bassBoost - S.beatLevel) * beatFollow;

  // 発話用のざっくりした音色重心。厳密なピッチ検出ではなく、声の明暗変化を見る。
  let brightness = S.voiceBrightness;
  if (isMic && !calibrating) {
    const speechStart = Math.max(1, Math.floor(100 / hzPerBin));
    const speechEnd = Math.min(freqArray.length, Math.ceil(3200 / hzPerBin));
    let energy = 0;
    let weightedHz = 0;
    for (let i = speechStart; i < speechEnd; i++) {
      const e = Math.pow(freqArray[i] / 255, 1.7);
      const hz = i * hzPerBin;
      energy += e;
      weightedHz += hz * e;
    }
    if (energy > 0.001) {
      const centroidHz = weightedHz / energy;
      brightness = clamp01((centroidHz - 180) / 2100);
    }
  }

  const soundDetected = !calibrating && (
    S.audioLevel > SOUND_PRESENT_TRIGGER ||
    S.beatLevel > BASS_PRESENT_TRIGGER
  );

  if (soundDetected) {
    S.afterglow = 1.0;
    S.timeSinceSound = 0;
  } else {
    S.afterglow = Math.max(0, S.afterglow - dt * 2.6);
    S.timeSinceSound += dt;
  }

  updateVoiceBodyMotion(dt, isMic, calibrating, boosted, bassBoost, brightness);

  // 5秒地点で切り替えるのでなく、最後の1秒を使ってダンスから待機へ渡す。
  const listeningTarget = smooth01(
    (S.timeSinceSound - LISTENING_FADE_START_SEC) /
    Math.max(0.001, LISTENING_HOLD_SEC - LISTENING_FADE_START_SEC)
  );
  const blendSpeed = listeningTarget > S.listeningBlend ? 8.0 : LISTENING_EXIT_SPEED;
  S.listeningBlend += (listeningTarget - S.listeningBlend) * Math.min(1, dt * blendSpeed);

  if (S.listeningBlend > 0.995) S.listeningMode += dt;
  else if (S.listeningBlend < 0.01) S.listeningMode = 0;
}

function getFormationBase(i, count, cx, cy, baseSize) {
  if (count <= 1) return { x: cx, y: cy };
  const spacing = S.spacing * baseSize;

  if (S.formation === 'line') {
    return { x: cx + (i - (count - 1) / 2) * spacing, y: cy };
  }

  if (S.formation === 'circle') {
    const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
    return {
      x: cx + Math.cos(angle) * S.circleRadius,
      y: cy + Math.sin(angle) * S.circleRadius
    };
  }

  if (S.formation === 'grid') {
    const cols = Math.ceil(Math.sqrt(count));
    const rows = Math.ceil(count / cols);
    const col = i % cols;
    const row = Math.floor(i / cols);
    const rowCount = (row === rows - 1) ? (count - row * cols) : cols;
    const gridSpacing = spacing * 0.7;
    return {
      x: cx + (col - (rowCount - 1) / 2) * gridSpacing,
      y: cy + (row - (rows - 1) / 2) * gridSpacing
    };
  }

  if (S.formation === 'vshape') {
    const half = (count - 1) / 2;
    const rel = i - half;
    return {
      x: cx + rel * spacing * 0.7,
      y: cy - Math.abs(rel) * spacing * 0.5 + spacing * 0.3
    };
  }

  if (S.formation === 'zigzag') {
    const rel = i - (count - 1) / 2;
    const zigY = (i % 2 === 0) ? -spacing * 0.35 : spacing * 0.35;
    return {
      x: cx + rel * spacing * 0.65,
      y: cy + zigY
    };
  }

  if (S.formation === 'spiral') {
    const armAngle = i * (Math.PI * 2 / 3.5);
    const radius = spacing * 0.35 * i;
    return {
      x: cx + Math.cos(armAngle) * radius,
      y: cy + Math.sin(armAngle) * radius
    };
  }

  return { x: cx, y: cy };
}

function getMotionOffset(i, count, baseSize, beat, basePos, cx, cy) {
  if (S.motion === 'none' || count <= 1) {
    return { dx: 0, dy: 0, sizeScale: 1, colorFactor: 1 };
  }

  const fTime = beat * 0.5;
  const t2pi = fTime * Math.PI * 2;

  let dx = 0, dy = 0, sizeScale = 1, colorFactor = 1;

  switch (S.motion) {
    case 'wave': {
      dy = Math.sin(t2pi + i * 0.8) * baseSize * 0.5;
      break;
    }
    case 'accordion': {
      const relX = basePos.x - cx;
      const relY = basePos.y - cy;
      const stretch = Math.sin(t2pi) * 0.5;
      dx = relX * stretch;
      dy = relY * stretch;
      break;
    }
    case 'seesaw': {
      const relX = basePos.x - cx;
      const denom = baseSize * 3 || 1;
      const tilt = relX / denom;
      dy = Math.sin(t2pi) * tilt * baseSize * 0.8;
      break;
    }
    case 'breathe': {
      const relX = basePos.x - cx;
      const relY = basePos.y - cy;
      const pulseAmt = Math.sin(t2pi) * 0.2;
      dx = relX * pulseAmt;
      dy = relY * pulseAmt;
      break;
    }
    case 'petal': {
      const relX = basePos.x - cx;
      const relY = basePos.y - cy;
      const len = Math.sqrt(relX*relX + relY*relY) || 1;
      const dir = i % 2 === 0 ? 1 : -1;
      const amt = Math.sin(t2pi) * baseSize * 0.6 * dir;
      dx = (relX / len) * amt;
      dy = (relY / len) * amt;
      break;
    }
    case 'star': {
      const relX = basePos.x - cx;
      const relY = basePos.y - cy;
      const len = Math.sqrt(relX*relX + relY*relY) || 1;
      const spike = Math.sin(t2pi + i * (Math.PI * 2 / count));
      const amt = Math.pow(Math.abs(spike), 0.5) * Math.sign(spike) * baseSize * 0.7;
      dx = (relX / len) * amt;
      dy = (relY / len) * amt;
      break;
    }
    case 'jitter': {
      const ps = puddingStates[i];
      if (ps) {
        const speed = ps.jitterSpeed * 3.5;
        const amp = baseSize * 0.7 * ps.jitterAmp;
        dx = Math.sin(t2pi * speed + ps.jitterPhase) * amp * ps.jitterDirX * 2;
        dy = Math.cos(t2pi * speed * 1.3 + ps.jitterPhase * 1.7) * amp * ps.jitterDirY * 2;
      }
      break;
    }
    case 'orbit': {
      const relX = basePos.x - cx;
      const relY = basePos.y - cy;
      const orbAngle = fTime * Math.PI * 0.5;
      const cosA = Math.cos(orbAngle);
      const sinA = Math.sin(orbAngle);
      dx = relX * cosA - relY * sinA - relX;
      dy = relX * sinA + relY * cosA - relY;
      break;
    }
    case 'drift': {
      dx = Math.sin(t2pi * 0.7) * baseSize * 1.2;
      dy = Math.sin(t2pi * 1.4) * baseSize * 0.6;
      break;
    }
    case 'pulse': {
      sizeScale = 1 + Math.sin(t2pi) * 0.3;
      break;
    }
    case 'depthwave': {
      const z = Math.sin(t2pi + i * (Math.PI * 2 / count));
      sizeScale = 1 + z * 0.35;
      dy = z * baseSize * 0.4;
      colorFactor = 1 + z * 0.25;
      break;
    }
  }

  return { dx, dy, sizeScale, colorFactor };
}

function getFormationTarget(i, count, cx, cy, baseSize, beat) {
  const base = getFormationBase(i, count, cx, cy, baseSize);
  const m = getMotionOffset(i, count, baseSize, beat, base, cx, cy);
  return {
    x: base.x + m.dx,
    y: base.y + m.dy,
    sizeScale: m.sizeScale,
    colorFactor: m.colorFactor
  };
}

function getDetachedTarget(ps, i, count, cx, cy, baseSize, beat) {
  const virtualBase = { x: ps.detachX, y: ps.detachY };
  const m = getMotionOffset(i, count, baseSize, beat, virtualBase, cx, cy);
  return {
    x: ps.detachX + m.dx,
    y: ps.detachY + m.dy,
    sizeScale: m.sizeScale,
    colorFactor: m.colorFactor
  };
}

function updateSmoothPosition(ps, target, dt) {
  if (!ps.posReady) {
    ps.fx = target.x;
    ps.fy = target.y;
    ps.posReady = true;
    return { x: ps.fx, y: ps.fy };
  }
  const k = Math.min(1, dt * 5.0);
  ps.fx += (target.x - ps.fx) * k;
  ps.fy += (target.y - ps.fy) * k;
  return { x: ps.fx, y: ps.fy };
}

function catmullRomPoints(controlPts, segments) {
  const out = [];
  const n = controlPts.length;
  for (let i = 0; i < n; i++) {
    const p0 = controlPts[(i-1+n)%n];
    const p1 = controlPts[i];
    const p2 = controlPts[(i+1)%n];
    const p3 = controlPts[(i+2)%n];
    for (let s = 0; s < segments; s++) {
      const t = s/segments, t2=t*t, t3=t2*t;
      out.push({
        x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
      });
    }
  }
  return out;
}

function makeBodyDeformer(w, h, bodyTop, bodyBot, deform = {}) {
  const lean = deform.lean || 0;
  const stretch = deform.stretch || 0;
  const width = deform.width || 0;

  return (x, y) => {
    // bodyBot以下は影響ゼロ。上へ行くほど変形量を増やし、底辺を水平固定する。
    const uRaw = (bodyBot - y) / Math.max(1, bodyBot - bodyTop);
    const u = clamp01(uRaw);
    const anchor = smooth01(u);
    const upper = anchor * (0.38 + 0.62 * u);

    return {
      x: x * (1 + width * upper) + lean * w * upper,
      y: y - stretch * h * upper
    };
  };
}

function makePuddingOutline(w, h, bodyTop, bodyBot, jig, deform = {}) {
  const topW = w*0.58 + jig(7,w*0.04);
  const botW = w*1.05 + jig(5,w*0.03);
  const cp = [];
  for(let i=0;i<=7;i++){
    const a=Math.PI-(Math.PI*i/7);
    cp.push({x:Math.cos(a)*botW/2+jig(5+a,1.5), y:bodyBot+Math.sin(a)*h*0.05});
  }
  for(let i=1;i<=3;i++){
    const t=i/4;
    cp.push({x:botW/2+(topW/2-botW/2)*t+Math.sin(t*Math.PI)*w*0.03+jig(9+t,1.5), y:bodyBot+(bodyTop-bodyBot)*t});
  }
  for(let i=0;i<=5;i++){
    const a=(i/5)*Math.PI;
    cp.push({x:Math.cos(a)*topW/2+jig(6+a,1.5), y:bodyTop-Math.sin(a)*h*0.08+jig(10,1)});
  }
  for(let i=1;i<=3;i++){
    const t=i/4;
    cp.push({x:-topW/2+(-botW/2+topW/2)*t-Math.sin(t*Math.PI)*w*0.03+jig(8+t,1.5), y:bodyTop+(bodyBot-bodyTop)*t});
  }

  const deformPoint = makeBodyDeformer(w, h, bodyTop, bodyBot, deform);
  const pts = catmullRomPoints(cp,4).map(p => deformPoint(p.x, p.y));
  return {pts, bodyTop, deformPoint};
}

function getClickReactionTransform(cr, t, size) {
  const elapsed = t - cr.startTime;
  let dy = 0, scX = 1, scY = 1;
  let phase = 'end';

  if (elapsed < CR_TAME) {
    const p = elapsed / CR_TAME;
    scX = 1 - p * 0.12;
    scY = 1 - p * 0.15;
    phase = 'tame';
  } else if (elapsed < CR_TAME + CR_FLY) {
    const local = (elapsed - CR_TAME) / CR_FLY;
    dy = -Math.sin(local * Math.PI) * size * 1.6;
    scX = Math.cos(local * Math.PI * 2);
    scY = 1 + Math.sin(local * Math.PI) * 0.10;
    phase = 'fly';
  } else if (elapsed < CR_TOTAL) {
    const local = (elapsed - CR_TAME - CR_FLY) / CR_LAND;
    scY = 1 - Math.sin(local * Math.PI) * 0.15;
    scX = 1 + Math.sin(local * Math.PI) * 0.10;
    phase = 'land';
  }

  return { dy, scX, scY, phase, elapsed };
}

function adjustColor(sk, colorStr, factor) {
  const c = sk.color(colorStr);
  const r = sk.red(c) * factor;
  const g = sk.green(c) * factor;
  const b = sk.blue(c) * factor;
  return sk.color(
    Math.max(0, Math.min(255, r)),
    Math.max(0, Math.min(255, g)),
    Math.max(0, Math.min(255, b))
  );
}

new p5(sk => {
  let t = 0;
  let beatAccum = 0;

  sk.setup = () => {
    const c = sk.createCanvas(sk.windowWidth, sk.windowHeight);
    c.style('display','block');
  };

  sk.windowResized = () => {
    sk.resizeCanvas(sk.windowWidth, sk.windowHeight);
    for (const ps of puddingStates) {
      if (!ps.detached) ps.posReady = false;
    }
  };

  sk.mousePressed = () => {
    if (document.elementFromPoint(sk.mouseX, sk.mouseY)?.closest('#gui, #guiToggle, #mediaPreview')) return;
    const baseSize = Math.min(sk.width, sk.height) * 0.16 * S.zoom;
    const hitRadius = baseSize * 0.7;
    let closestDist = Infinity;
    let closestIdx = -1;
    for (let i = 0; i < puddingStates.length; i++) {
      const ps = puddingStates[i];
      if (!ps.posReady) continue;
      const dx = sk.mouseX - ps.fx;
      const dy = sk.mouseY - ps.fy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < hitRadius && dist < closestDist) {
        closestDist = dist;
        closestIdx = i;
      }
    }
    if (closestIdx >= 0) {
      selectedIndex = closestIdx;
      const ps = puddingStates[closestIdx];
      dragOffsetX = ps.fx - sk.mouseX;
      dragOffsetY = ps.fy - sk.mouseY;
      dragStartX = sk.mouseX;
      dragStartY = sk.mouseY;
      hasDragged = false;
      gazeTarget = closestIdx;
      gazeHoldTimer = 0;
    }
  };

  sk.mouseDragged = () => {
    if (selectedIndex < 0 || selectedIndex >= puddingStates.length) return;
    const baseSize = Math.min(sk.width, sk.height) * 0.16 * S.zoom;
    const dragThreshold = baseSize * 0.05;
    const totalMove = Math.sqrt(
      (sk.mouseX - dragStartX) ** 2 + (sk.mouseY - dragStartY) ** 2
    );
    if (totalMove > dragThreshold) {
      hasDragged = true;
      const ps = puddingStates[selectedIndex];
      ps.detached = true;
      ps.detachX = sk.mouseX + dragOffsetX;
      ps.detachY = sk.mouseY + dragOffsetY;
      ps.fx = ps.detachX;
      ps.fy = ps.detachY;
      ps.posReady = true;
    }
  };

  sk.mouseReleased = () => {
    if (selectedIndex >= 0 && selectedIndex < puddingStates.length) {
      const ps = puddingStates[selectedIndex];
      if (!hasDragged) {
        ps.clickReaction = { startTime: t };
        ps.recoveryTimer = 0;
      }
      gazeHoldTimer = GAZE_HOLD_SEC;
    }
    selectedIndex = -1;
    hasDragged = false;
  };

  sk.draw = () => {
    const dt = sk.deltaTime/1000;
    t += dt;
    smoothBPM += (S.bpm-smoothBPM)*Math.min(1,dt*3);
    sk.background(S.colBg);

    updateAudioLevel(dt);

    ensurePuddingStates(S.count);

    exprTimer += dt;
    if(exprTimer > EXPR_INTERVAL){
      exprTimer = 0;
      const pool = danceExprMap[S.dance]||[0];
      currentExprIdx = pool[Math.floor(Math.random()*pool.length)];
    }

    if(S.auto){
      S.autoTimer += dt;
      if(S.autoTimer > S.autoInterval){
        S.autoTimer = 0;

        S.dance = danceList[Math.floor(Math.random()*danceList.length)];
        $('dance').value=S.dance;
        $('danceVal').textContent=$('dance').selectedOptions[0].text;

        S.formation = FORMATIONS[Math.floor(Math.random()*FORMATIONS.length)];
        $('formation').value=S.formation;
        $('formationVal').textContent=$('formation').selectedOptions[0].text;
        updateVisibleControls();

        S.motion = MOTIONS[Math.floor(Math.random()*MOTIONS.length)];
        $('motion').value = S.motion;
        $('motionVal').textContent = MOTION_LABELS[S.motion] || S.motion;

        if (!S.locks.bpm) {
          S.bpm = 80+Math.floor(Math.random()*70);
          $('bpm').value=S.bpm; $('bpmVal').textContent=S.bpm;
        }
      }
    }

    for(let i=0;i<blinkStates.length;i++){
      const bs = blinkStates[i];
      if(bs.blinking){
        bs.blinkTimer += dt;
        if(bs.blinkTimer >= bs.blinkDuration){
          bs.blinking = false;
          bs.nextBlink = 1.5 + Math.random()*4;
          bs.blinkDuration = 0.08 + Math.random()*0.1;
          bs.blinkStyle = blinkStyles[Math.floor(Math.random()*blinkStyles.length)];
        }
      } else {
        bs.nextBlink -= dt;
        if(bs.nextBlink <= 0) {
          bs.blinking = true;
          bs.blinkTimer = 0;
        }
      }
    }

    if (selectedIndex < 0 && gazeTarget >= 0) {
      gazeHoldTimer -= dt;
      if (gazeHoldTimer <= 0) gazeTarget = -1;
    }

    const beatSec = 60/smoothBPM;
    beatAccum += dt/beatSec;
    const beat = beatAccum;
    const cx = sk.width/2;
    const cy = sk.height*0.58;
    const baseSize = Math.min(sk.width,sk.height)*0.16*S.zoom;

    const drawItems = [];
    for (let i = 0; i < S.count; i++) {
      const ps = puddingStates[i];
      let pos, sizeScale = 1, colorFactor = 1;

      if (i === selectedIndex && hasDragged) {
        pos = { x: ps.fx, y: ps.fy };
      } else if (ps.detached) {
        const target = getDetachedTarget(ps, i, S.count, cx, cy, baseSize, beat);
        pos = updateSmoothPosition(ps, target, dt);
        sizeScale = target.sizeScale;
        colorFactor = target.colorFactor;
      } else {
        const target = getFormationTarget(i, S.count, cx, cy, baseSize, beat);
        pos = updateSmoothPosition(ps, target, dt);
        sizeScale = target.sizeScale;
        colorFactor = target.colorFactor;
      }

      if (ps.cheekBoost > 0) ps.cheekBoost = Math.max(0, ps.cheekBoost - dt / 0.5);
      if (ps.jiggleBoost > 0) ps.jiggleBoost = Math.max(0, ps.jiggleBoost - dt / 1.0);
      if (ps.recoveryTimer > 0) ps.recoveryTimer = Math.max(0, ps.recoveryTimer - dt);

      if (ps.clickReaction) {
        const elapsed = t - ps.clickReaction.startTime;
        if (elapsed >= CR_TOTAL) {
          ps.cheekBoost = 1.0;
          ps.jiggleBoost = 1.0;
          ps.recoveryTimer = CR_RECOVERY;
          ps.clickReaction = null;
        }
      }

      const personalBeat = beat + ps.beatOffset * S.sync * 4;
      drawItems.push({ idx: i, x: pos.x, y: pos.y, personalBeat, sizeScale, colorFactor });
    }

    if (S.motion === 'depthwave') {
      drawItems.sort((a, b) => a.sizeScale - b.sizeScale);
    } else if (S.formation === 'circle' || S.formation === 'spiral') {
      drawItems.sort((a, b) => a.y - b.y);
    } else {
      drawItems.sort((a, b) => a.idx - b.idx);
    }

    for (const item of drawItems) {
      drawPudding(sk, item.x, item.y, baseSize * item.sizeScale, t, item.personalBeat + item.idx*0.35, item.idx, dt, item.colorFactor);
    }
  };

  function drawPudding(sk, px, py, size, time, beat, idx, dt, colorFactor) {
    sk.push();
    sk.translate(px, py);

    const ps = puddingStates[idx];
    const bs = blinkStates[idx % blinkStates.length];

    const cr = ps ? ps.clickReaction : null;
    const crTf = cr ? getClickReactionTransform(cr, time, size) : null;
    const inReaction = !!crTf;

    const recoveryRatio = ps && ps.recoveryTimer > 0 ? ps.recoveryTimer / CR_RECOVERY : 0;
    const danceInfluence = 1 - recoveryRatio;
    const expr = facePool[currentExprIdx];

    let dx=0, dy=0, rot=0, scX=1, scY=1;
    let bodyLean=0, bodyStretch=0, bodyWidth=0;
    const phase = beat*Math.PI*2;

    const audioInputActive = isAudioAnalysisActive();
    const isMicActive = audioInputActive && audioSourceType === 'mic';
    const isFileActive = audioInputActive && audioSourceType === 'file';
    const audioActive = audioInputActive && (
      S.audioLevel > LISTENING_TRIGGER ||
      S.beatLevel > 0.22 ||
      S.afterglow > 0.16
    );
    const listeningBlend = audioInputActive ? smooth01(S.listeningBlend) : 0;

    let danceDx=0, danceDy=0, danceScX=1, danceScY=1, danceRot=0;
    switch(S.dance){
      case 'bounce':
        danceDy=-Math.abs(Math.sin(phase))*size*0.35;
        danceScY=1+Math.abs(Math.sin(phase))*0.1;
        danceScX=1-Math.abs(Math.sin(phase))*0.06;
        danceRot=Math.sin(phase*0.5)*0.12; break;
      case 'twist':
        danceDy=-Math.abs(Math.sin(phase))*size*0.15;
        danceScX=1+Math.sin(phase)*0.15;
        danceScY=1-Math.sin(phase)*0.08;
        danceRot=Math.sin(phase*0.5)*0.08; break;
      case 'sway':
        danceDx=Math.sin(phase*0.5)*size*0.3;
        danceDy=-Math.abs(Math.sin(phase))*size*0.1;
        danceRot=Math.sin(phase*0.5)*0.22; break;
      case 'hop':
        danceDy=-Math.max(0,Math.sin(phase))*size*0.55;
        danceRot=Math.sin(phase*0.5)*0.15;
        danceScY=danceDy<-size*0.05?1.08:0.9;
        danceScX=danceDy<-size*0.05?0.93:1.08; break;
    }

    if (inReaction) {
      dy = crTf.dy;
      scX = crTf.scX;
      scY = crTf.scY;
    } else if (isFileActive && audioActive) {
      // 基準版のファイル・ビート反応を維持。
      const beatShaped = Math.pow(S.beatLevel, 0.55);
      const voiceShaped = Math.pow(S.audioLevel, 0.6);
      const audioPush = (beatShaped * 1.2 + voiceShaped * 0.6) * size * 0.9;
      dy = -audioPush;
      scY = 1 + Math.min(0.15, audioPush / size * 0.3);
      scX = 1 - Math.min(0.10, audioPush / size * 0.2);
    } else if (isMicActive && (audioActive || S.voicePresence > 0.015)) {
      // 発話中は跳ばない。底を接地させ、声の抑揚を上体のたわみと伸縮へ変換。
      bodyLean = S.voiceLean;
      bodyStretch = S.voiceShape;
      bodyWidth = -S.voiceShape * 0.50;
    } else if (audioInputActive && listeningBlend > 0.001) {
      // 通常ダンスを弱めながら、底を固定した「伺い」変形へ滑らかに渡す。
      const danceMix = 1 - listeningBlend;
      dx = danceDx * danceInfluence * danceMix;
      dy = danceDy * danceInfluence * danceMix;
      rot = danceRot * danceInfluence * danceMix;
      scX = 1 + (danceScX - 1) * danceInfluence * danceMix;
      scY = 1 + (danceScY - 1) * danceInfluence * danceMix;

      const off = ps ? ps.listeningPhaseOffset : 0;
      const slowSway =
        Math.sin(time * 1.14 + off) * 0.064 +
        Math.sin(time * 0.47 + off * 1.63) * 0.016;
      bodyLean = slowSway * listeningBlend;
      bodyStretch = Math.sin(time * 0.61 + off) * 0.006 * listeningBlend;
      bodyWidth = -bodyStretch * 0.35;
    } else {
      dx = danceDx * danceInfluence;
      dy = danceDy * danceInfluence;
      rot = danceRot * danceInfluence;
      scX = 1 + (danceScX - 1) * danceInfluence;
      scY = 1 + (danceScY - 1) * danceInfluence;
    }

    if (ps) {
      const currentY = py + dy;
      const velocityY = currentY - ps.prevY;
      ps.prevY = currentY;
      const caramelTargetY = -velocityY * 0.6;
      ps.caramelDelayY += (caramelTargetY - ps.caramelDelayY) * Math.min(1, dt * 15);
    }

    sk.translate(dx,dy);
    sk.rotate(rot);
    sk.scale(scX,scY);

    const isFront = scX >= 0;
    const w=size, h=size*0.85;
    const jiggleBoost = ps ? ps.jiggleBoost : 0;
    let jiggleMul = 1;
    if (inReaction) {
      jiggleMul = 0;
    } else if (audioInputActive && listeningBlend > 0.001 && !audioActive) {
      jiggleMul = 0.16 + (1 - listeningBlend) * 0.28;
    } else if (isMicActive && (audioActive || S.voicePresence > 0.015)) {
      jiggleMul = 0.34 + S.voicePresence * 0.18;
    } else if (isFileActive && audioActive) {
      jiggleMul = 0.6;
    } else {
      jiggleMul = danceInfluence * (1 + jiggleBoost);
    }

    const j = S.jiggle * jiggleMul;
    const jig=(freq,amp)=>Math.sin(time*freq+idx*2)*amp*j;
    const bodyTop=-h*0.45, bodyBot=h*0.4;
    const deform = { lean: bodyLean, stretch: bodyStretch, width: bodyWidth };
    const outline = makePuddingOutline(w,h,bodyTop,bodyBot,jig,deform);
    const pts = outline.pts;
    const deformPoint = outline.deformPoint;

    const bodyColor = adjustColor(sk, S.colBody, colorFactor);
    sk.noStroke(); sk.fill(bodyColor);
    sk.beginShape();
    for(const p of pts) sk.vertex(p.x,p.y);
    sk.endShape(sk.CLOSE);

    const caramelOffsetY = ps ? ps.caramelDelayY : 0;
    const caraColor = adjustColor(sk, S.colCara, colorFactor);
    sk.drawingContext.save();
    sk.drawingContext.beginPath();
    for(let i=0;i<pts.length;i++){
      if(i===0) sk.drawingContext.moveTo(pts[i].x,pts[i].y);
      else sk.drawingContext.lineTo(pts[i].x,pts[i].y);
    }
    sk.drawingContext.closePath();
    sk.drawingContext.clip();
    const caraY1 = bodyTop-h*0.2+caramelOffsetY;
    const caraY2 = bodyTop+h*0.06+caramelOffsetY;
    const c1 = deformPoint(-w, caraY1);
    const c2 = deformPoint(w, caraY1);
    const c3 = deformPoint(w, caraY2);
    const c4 = deformPoint(-w, caraY2);
    sk.fill(caraColor);
    sk.beginShape();
    sk.vertex(c1.x,c1.y); sk.vertex(c2.x,c2.y);
    sk.vertex(c3.x,c3.y); sk.vertex(c4.x,c4.y);
    sk.endShape(sk.CLOSE);
    sk.drawingContext.restore();

    if (isFront) {
      const eyeY=-h*0.05+jig(2,1.5);
      const eyeSpacing=w*0.17;
      const eyeBase=size*0.06;
      const es=expr.eyeScale;
      const maxLook = eyeBase * 0.9;
      const isGazing = (gazeTarget === idx);

      let targetLookX, targetLookY;
      if (audioInputActive && listeningBlend > 0.6 && !audioActive) {
        targetLookX = bodyLean * size * 0.24;
        targetLookY = 0;
      } else if (isGazing) {
        const localMX = (sk.mouseX - px) / (scX || 0.001);
        const localMY = (sk.mouseY - py - dy) / (scY || 0.001);
        const dxL = localMX;
        const dyL = localMY - eyeY;
        const dist = Math.sqrt(dxL * dxL + dyL * dyL) || 1;
        const strength = Math.min(1, dist / (size * 0.5));
        targetLookX = (dxL / dist) * maxLook * strength;
        targetLookY = (dyL / dist) * maxLook * strength * 0.7;
      } else {
        targetLookX = Math.sin(time*1.3+idx)*2.5;
        targetLookY = Math.cos(time*0.9+idx)*1.5;
      }

      const gs = gazeSmooth[idx % gazeSmooth.length];
      const lerpSpeed = isGazing ? 10 : 4;
      gs.x += (targetLookX - gs.x) * Math.min(1, dt * lerpSpeed);
      gs.y += (targetLookY - gs.y) * Math.min(1, dt * lerpSpeed);
      const lookX = gs.x;
      const lookY = gs.y;

      const leftEye = deformPoint(-eyeSpacing, eyeY);
      const rightEye = deformPoint(eyeSpacing, eyeY);
      const leftPupil = deformPoint(-eyeSpacing + lookX, eyeY + lookY);
      const rightPupil = deformPoint(eyeSpacing + lookX, eyeY + lookY);
      const isBlinking = bs.blinking;
      const bStyle = bs.blinkStyle;

      sk.noStroke();
      if(isBlinking){
        sk.stroke(40,30,20,180);
        sk.strokeWeight(1.8);
        sk.noFill();
        const ew = eyeBase*2.5*es;
        if(bStyle === 'shut'){
          sk.line(leftEye.x-ew/2, leftEye.y, leftEye.x+ew/2, leftEye.y);
          sk.line(rightEye.x-ew/2, rightEye.y, rightEye.x+ew/2, rightEye.y);
        } else if(bStyle === 'squint'){
          sk.arc(leftEye.x, leftEye.y-2, ew, eyeBase*1.2, 0.2, Math.PI-0.2);
          sk.arc(rightEye.x, rightEye.y-2, ew, eyeBase*1.2, 0.2, Math.PI-0.2);
        } else if(bStyle === 'happy'){
          sk.arc(leftEye.x, leftEye.y+2, ew, eyeBase*1.5, Math.PI+0.3, -0.3);
          sk.arc(rightEye.x, rightEye.y+2, ew, eyeBase*1.5, Math.PI+0.3, -0.3);
        }
        sk.noStroke();
      } else {
        sk.fill(255);
        sk.ellipse(leftEye.x,leftEye.y,eyeBase*2.5*es,eyeBase*2.8*es);
        sk.ellipse(rightEye.x,rightEye.y,eyeBase*2.5*es,eyeBase*2.8*es);
        sk.fill(25);
        sk.ellipse(leftPupil.x,leftPupil.y,eyeBase*1.5*es,eyeBase*1.7*es);
        sk.ellipse(rightPupil.x,rightPupil.y,eyeBase*1.5*es,eyeBase*1.7*es);
        sk.fill(255);
        sk.ellipse(leftPupil.x-1.5,leftPupil.y-1.5,eyeBase*0.55,eyeBase*0.55);
        sk.ellipse(rightPupil.x-1.5,rightPupil.y-1.5,eyeBase*0.55,eyeBase*0.55);
      }

      const cheekBoost = ps ? ps.cheekBoost : 0;
      const cheekAlphaEff = Math.min(1.0, S.cheekAlpha + cheekBoost * 0.5);
      const cheekCol = sk.color(S.colCheek);
      cheekCol.setAlpha(cheekAlphaEff * 255);
      sk.fill(cheekCol);
      const leftCheek = deformPoint(-eyeSpacing-w*0.13, eyeY+size*0.08);
      const rightCheek = deformPoint(eyeSpacing+w*0.13, eyeY+size*0.08);
      sk.ellipse(leftCheek.x,leftCheek.y,size*0.15,size*0.09);
      sk.ellipse(rightCheek.x,rightCheek.y,size*0.15,size*0.09);

      const mouthY=eyeY+size*0.12;
      const mouth = deformPoint(0,mouthY);
      const mSize=size*0.05;
      switch(expr.mouthType){
        case 'smile':
          sk.noFill();sk.stroke(80,50,30,130);sk.strokeWeight(1.5);
          sk.arc(mouth.x,mouth.y,mSize*2,mSize*1.2,0.1,Math.PI-0.1);break;
        case 'grin':
          sk.noFill();sk.stroke(80,50,30,130);sk.strokeWeight(1.5);
          sk.arc(mouth.x,mouth.y,mSize*2.8,mSize*1.8,0.05,Math.PI-0.05);break;
        case 'oh':
          sk.noStroke();sk.fill(80,50,30,100);
          sk.ellipse(mouth.x,mouth.y,mSize*1.2,mSize*1.6);break;
        case 'open':
          sk.noStroke();sk.fill(80,50,30,120);
          sk.ellipse(mouth.x,mouth.y,mSize*2,mSize*2.4);
          sk.fill(255,100,120,70);
          sk.ellipse(mouth.x,mouth.y+mSize*0.4,mSize*0.8,mSize*0.5);break;
        case 'smirk':
          sk.noFill();sk.stroke(80,50,30,130);sk.strokeWeight(1.5);
          sk.arc(mouth.x+mSize*0.3,mouth.y,mSize*1.8,mSize*1.0,0.2,Math.PI*0.7);break;
        case 'hehe':
          sk.noStroke();sk.fill(80,50,30,110);
          sk.arc(mouth.x,mouth.y,mSize*2.2,mSize*1.6,0,Math.PI,sk.CHORD);break;
        case 'pout':
          sk.noFill();sk.stroke(80,50,30,130);sk.strokeWeight(1.5);
          sk.arc(mouth.x,mouth.y+mSize*0.3,mSize*1.4,mSize*0.8,Math.PI+0.2,-0.2);break;
        case 'laugh':
          sk.noStroke();sk.fill(80,50,30,130);
          sk.arc(mouth.x,mouth.y,mSize*2.8,mSize*2.2,0,Math.PI,sk.CHORD);break;
      }
      sk.noStroke();
    }

    sk.pop();
  }
});
</script>
